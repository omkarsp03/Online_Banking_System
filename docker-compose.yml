version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: online_banking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your-db-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: online_banking
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-your-db-password}
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret}
      AES_SECRET: ${AES_SECRET:-your-aes-secret}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
